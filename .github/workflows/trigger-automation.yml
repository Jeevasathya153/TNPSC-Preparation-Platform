
name: Trigger Playwright Automation

on:
  push:
    branches:
      - main

jobs:
  trigger-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger automation tests
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/Jeevasathya153/tnpscplatform_automation/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"event_type\":\"tnpsc-application-push\",\"client_payload\":{\"source_sha\":\"$SOURCE_SHA\"}}"
